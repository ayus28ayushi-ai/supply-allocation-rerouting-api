<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dera App - Auth Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; width: 400px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #666; }
        .tab.active { color: #007bff; border-bottom: 3px solid #007bff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button.btn-submit { width: 100%; padding: 12px; background: #007bff; border: none; color: white; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button.btn-submit:hover { background: #0056b3; }
        .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: #888; font-size: 13px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #ddd; }
        .divider::before { margin-right: .5em; }
        .divider::after { margin-left: .5em; }
        .social-buttons { display: flex; flex-direction: column; gap: 10px; }
        .btn-social { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 14px; color: #333; border: 1px solid #ccc; background: #fff; transition: background 0.2s; }
        .btn-social:hover { background: #f8f9fa; }
        .btn-social svg { width: 20px; height: 20px; }
        .error-msg { color: #dc3545; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Dera Tester Auth</h2>

    <!-- Toggle Tabs -->
    <div class="tabs">
        <div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div>
        <div class="tab" id="registerTab" onclick="switchTab('register')">Register</div>
    </div>

    <!-- Login / Register Form -->
    <form id="authForm" onsubmit="handleAuth(event)">
        <div class="form-group" id="usernameGroup">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
        <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <!-- OAuth2 Redirect Links -->
    <div class="social-buttons">
        <a href="/oauth2/authorization/google" class="btn-social">
            <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Sign in with Google
        </a>

        <a href="/oauth2/authorization/github" class="btn-social">
            <svg viewBox="0 0 24 24"><path fill="#333" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            Sign in with GitHub
        </a>
    </div>
</div>

<script>
    let currentMode = 'login';

    function switchTab(mode) {
        currentMode = mode;
        const usernameGroup = document.getElementById('usernameGroup');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.style.display = 'none';

        if (mode === 'login') {
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('registerTab').classList.remove('active');
            usernameGroup.style.display = 'none';
            submitBtn.textContent = 'Sign In';
        } else {
            document.getElementById('registerTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            usernameGroup.style.display = 'block';
            submitBtn.textContent = 'Register';
        }
    }

    // Initialize mode
    switchTab('login');

    async function handleAuth(e) {
        e.preventDefault();
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.style.display = 'none';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const username = document.getElementById('username').value;

        const endpoint = currentMode === 'login' ? '/dera/login' : '/dera/register';
        const payload = currentMode === 'login'
            ? { email, password }
            : { username, email, password };

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                // Extract JWT string (adjust key 'token' or 'jwt' if your response DTO differs)
                const jwtToken = typeof data === 'string' ? data : (data.token || data.jwt || data.accessToken);

                if (jwtToken) {
                    // Redirect to Swagger UI carrying the token parameter
                    window.location.href = '/swagger-ui/index.html?token=' + jwtToken;
                } else {
                    alert('Registration successful! Please login.');
                    switchTab('login');
                }
            } else {
                errorMsg.textContent = data.message || 'Authentication failed.';
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.textContent = 'Failed to reach server.';
            errorMsg.style.display = 'block';
        }
    }
</script>

</body>
</html>

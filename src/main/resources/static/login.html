<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dera API - Auth Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.6)),
            url('auth_page.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 420px;
            padding: 36px 32px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);

        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.02em;
        }

        .brand-header p {
            font-size: 13px;
            color: #444e61;
            margin-top: 4px;
        }

        /* Modern Segmented Tab Switcher */
        .tabs {
            display: flex;
            background: #f3f4f6;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            color: #404a57;
            border-radius: 7px;
            transition: all 0.2s ease;
        }

        .tab.active {
            background: #ffffff;
            color: #111827;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        /* Form Inputs */
        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            width: 18px;
            height: 18px;
            fill: #9ca3af;
        }

        input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid #454849;
            border-radius: 8px;
            font-size: 14px;
            background: #ffffff;
            color: #111827;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .toggle-password svg { width: 18px; height: 18px; fill: #9ca3af; }

        /* Buttons */
        button.btn-submit {
            width: 100%;
            padding: 11px;
            background: #2563eb;
            border: none;
            color: white;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button.btn-submit:hover { background: #2b4891; }
        button.btn-submit:active { transform: scale(0.99); }

        /* Social OAuth Buttons */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 500;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }
        .divider::before { margin-right: .8em; }
        .divider::after { margin-left: .8em; }

        .social-buttons { display: flex; flex-direction: column; gap: 10px; }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 13px;
            color: #374151;
            border: 1px solid #d1d5db;
            background: #ffffff;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-social:hover { background: #f9fafb; border-color: #9ca3af; }
        .btn-social svg { width: 18px; height: 18px; }

        /* Alerts & Spinners */
        .alert-box {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-header">
        <h2>Dera API</h2>
        <p>Dynamic Emergency Rerouting & Allocation System</p>
    </div>

    <div class="tabs">
        <div class="tab active" id="loginTab" onclick="switchTab('login')">Sign In</div>
        <div class="tab" id="registerTab" onclick="switchTab('register')">Register</div>
    </div>

    <form id="authForm" onsubmit="handleAuth(event)">
        <div class="form-group" id="usernameGroup" style="display: none;">
            <label for="username">Username</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <input type="text" id="username" placeholder="Choose a username">
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email address</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                <input type="email" id="email" placeholder="name@gmail.com" required>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <input type="password" id="password" placeholder="••••••••" required>
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                    <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">Sign In</span>
        </button>

        <div class="alert-box" id="alertMsg"></div>
    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <div class="social-buttons">
        <a href="/oauth2/authorization/google" class="btn-social">
            <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Google
        </a>
        <a href="/oauth2/authorization/github" class="btn-social">
            <svg viewBox="0 0 24 24"><path fill="#333" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            GitHub
        </a>
    </div>
</div>

<script>
    let currentMode = 'login';

    function switchTab(mode) {
        currentMode = mode;
        const usernameGroup = document.getElementById('usernameGroup');
        const btnText = document.getElementById('btnText');
        hideAlert();

        if (mode === 'login') {
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('registerTab').classList.remove('active');
            usernameGroup.style.display = 'none';
            btnText.textContent = 'Sign In';
        } else {
            document.getElementById('registerTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            usernameGroup.style.display = 'block';
            btnText.textContent = 'Create Account';
        }
    }

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }

    function showAlert(msg, isSuccess = false) {
        const alertBox = document.getElementById('alertMsg');
        alertBox.textContent = msg;
        alertBox.className = 'alert-box ' + (isSuccess ? 'alert-success' : 'alert-error');
        alertBox.style.display = 'block';
    }

    function hideAlert() {
        document.getElementById('alertMsg').style.display = 'none';
    }

    function setLoading(isLoading) {
        document.getElementById('btnSpinner').style.display = isLoading ? 'inline-block' : 'none';
        document.getElementById('submitBtn').disabled = isLoading;
    }

    async function handleAuth(e) {
        e.preventDefault();
        hideAlert();
        setLoading(true);

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const username = document.getElementById('username').value;

        const endpoint = currentMode === 'login' ? '/dera/login' : '/dera/register';
        const payload = currentMode === 'login'
            ? { email, password }
            : { username, email, password };

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            setLoading(false);

            if (response.ok) {
                const jwtToken = typeof data === 'string' ? data : (data.token || data.jwt || data.accessToken);
                if (jwtToken) {
                    window.location.href = '/swagger-ui/index.html?token=' + jwtToken;
                } else {
                    showAlert('Account created! Please sign in.', true);
                    switchTab('login');
                }
            } else {
                showAlert(data.message || 'Authentication failed. Please check your credentials.');
            }
        } catch (err) {
            setLoading(false);
            showAlert('Unable to connect to the authentication server.');
        }
    }
</script>

</body>
</html>

spring.application.name=dera


#connection to the database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/triage_dera_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRE_PASSWORD}}

jwt.secret=${JWT_SECRET_KEY}
jwt.expiration-ms=86400000


spring.datasource.driver-class-name=org.postgresql.Driver

#disabling auto generation of tables by hibernate so the "flyway" can manage the existing tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.lock.timeout=3000
spring.datasource.hikari.connection-timeout=5000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email


spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user


flyway.clean-disabled=true

# Force Spring Boot to respect HTTPS headers from Render's proxy
server.forward-headers-strategy=framework

logging.level.org.springframework.security=DEBUG
